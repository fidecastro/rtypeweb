<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>R-Type Web</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        background: #0b0f14;
        color: #e8eef5;
      }
      main {
        text-align: center;
        padding: 1rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        font-size: 1.25rem;
      }
      p#status {
        margin: 0 0 0.75rem;
        opacity: 0.75;
        font-size: 0.9rem;
      }
      #game {
        display: block;
        margin: 0 auto;
        max-width: 100%;
        height: auto;
        border: 1px solid #243044;
        border-radius: 4px;
        background: #0b1220;
        touch-action: none;
        image-rendering: pixelated;
      }
      .hint {
        margin: 0.75rem 0 0;
        font-size: 0.8rem;
        opacity: 0.55;
      }
      #player-identity {
        margin: 0.5rem 0 0;
        font-size: 0.85rem;
        opacity: 0.8;
      }
      #register-form {
        margin: 0.75rem auto 0;
        max-width: 360px;
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        justify-content: center;
        align-items: center;
        text-align: left;
      }
      #register-form[hidden] {
        display: none !important;
      }
      #register-form label {
        font-size: 0.75rem;
        opacity: 0.7;
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
      }
      #register-form input {
        font: inherit;
        font-size: 0.85rem;
        padding: 0.3rem 0.45rem;
        border: 1px solid #243044;
        border-radius: 4px;
        background: #121a28;
        color: #e8eef5;
        width: 10rem;
      }
      #register-form button {
        font: inherit;
        font-size: 0.85rem;
        padding: 0.4rem 0.75rem;
        border: 1px solid #334155;
        border-radius: 4px;
        background: #1e293b;
        color: #e8eef5;
        cursor: pointer;
        align-self: flex-end;
      }
      #register-form button:hover {
        background: #334155;
      }
      #register-form button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #reg-status {
        flex-basis: 100%;
        margin: 0.15rem 0 0;
        font-size: 0.8rem;
        opacity: 0.75;
        min-height: 1.1em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">R-Type Web</h1>
      <p id="status">Loading…</p>
      <canvas
        id="game"
        width="960"
        height="540"
        aria-label="R-Type Web game view"
      ></canvas>
      <p id="player-identity" hidden></p>
      <form id="register-form" hidden autocomplete="on">
        <label>
          Nickname
          <input
            id="reg-nickname"
            name="nickname"
            type="text"
            maxlength="32"
            required
            placeholder="Ace"
          />
        </label>
        <label>
          Email
          <input
            id="reg-email"
            name="email"
            type="email"
            maxlength="254"
            required
            placeholder="ace@example.com"
          />
        </label>
        <button id="reg-submit" type="submit">Register</button>
        <p id="reg-status"></p>
      </form>
      <p class="hint">
        WASD / arrows · Space fire / confirm · Esc/M menu · H debug damage · G debug score ·
        touch: left steer, right fire
      </p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
