<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>R-Type Web</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        background: #0b0f14;
        color: #e8eef5;
      }
      main {
        text-align: center;
        padding: 1rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        font-size: 1.25rem;
      }
      p#status {
        margin: 0 0 0.75rem;
        opacity: 0.75;
        font-size: 0.9rem;
      }
      #game {
        display: block;
        margin: 0 auto;
        max-width: 100%;
        height: auto;
        border: 1px solid #243044;
        border-radius: 4px;
        background: #0b1220;
        touch-action: none;
        image-rendering: pixelated;
      }
      .hint {
        margin: 0.75rem 0 0;
        font-size: 0.8rem;
        opacity: 0.55;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">R-Type Web</h1>
      <p id="status">Loading…</p>
      <canvas
        id="game"
        width="960"
        height="540"
        aria-label="R-Type Web game view"
      ></canvas>
      <p class="hint">WASD / arrows · Space fire / confirm · touch: left steer, right fire</p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
